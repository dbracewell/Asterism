# Version updates (US-92.1). Each ecosystem gets one weekly pull request with
# its minor and patch updates grouped; a major update gets a pull request of its
# own. The cooldown holds back releases younger than a week, like pnpm's
# minimumReleaseAge; security updates are not held back. Every pull request runs
# the full CI, the upgrade check from the previous release included. Reviewing
# one: docs/development.md, "Dependency updates".
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # A new Python or Node version is an upgrade to plan, not a weekly bump:
    # Python 3.13 -> 3.15 counts as "minor" here and broke the build (no
    # onnxruntime wheel). Digest refreshes of the same version still come.
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      docker:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /apps/backend
    # Update uv.lock within pyproject.toml's ranges. Upper caps such as
    # lancedb <0.30 (stored vectors) are deliberate; the default strategy
    # rewrote that one to <0.42. Raising a cap is a change made by hand.
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv:
        update-types: [minor, patch]
