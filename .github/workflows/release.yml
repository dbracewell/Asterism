name: Release

# US-91.5: a pushed v<version> tag (from `pnpm release`) publishes the CPU image
# to ghcr.io/dbracewell/asterism for amd64 and arm64. Each architecture is
# pushed by digest only, pulled back, checked as in CI (US-91.2) and scanned for
# fixable critical and high vulnerabilities (US-92.2, US-95.5); only when both pass do the version
# and `latest` tags point at them. The GPU build is built from source and not
# published.
#
# US-92.3: each architecture carries an SPDX SBOM and full BuildKit provenance
# in the index. The publish job then attests the published index (provenance,
# and each architecture's SBOM) as GitHub artifact attestations, and fails the
# run unless `gh attestation verify` accepts them.
#
# US-92.4: the publish job also signs the index with cosign, keyless, and fails
# unless `cosign verify` accepts it for this workflow and tag. A rehearsal never
# reaches the publish job, so it signs nothing.
#
# US-118.1: once the image is published, signed and verified, the release-page
# job creates the tag's GitHub Release from its section of the release notes,
# marked latest only when it is the newest release.
#
# Run it by hand (Actions → Release → Run workflow) to rehearse a release: it
# builds, pushes by digest and checks both architectures, but tags nothing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dbracewell/asterism

jobs:
  version:
    name: Check the tag is the app version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the tag with package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME is not v$version; tag releases with pnpm release" >&2
            exit 1
          fi
          node scripts/check-workspace-tasks.mjs
          echo "version=$version" >> "$GITHUB_OUTPUT"

  image:
    name: Build and check ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            # Shares the CI job's cache, so a release rebuilds little.
            cache: asterism-image
          - arch: arm64
            runner: ubuntu-24.04-arm
            cache: asterism-image-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Make room for the image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install dependencies for the theme storage check
        run: |
          pnpm install --frozen-lockfile --config.ignore-scripts=true
          pnpm --filter @asterism/frontend install --frozen-lockfile --config.ignore-scripts=true

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          use: false

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            ASTERISM_VERSION=${{ needs.version.outputs.version }}
            ASTERISM_COMMIT=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # US-92.3: the pushed digest names an index holding the image and an
          # attestation manifest with its SPDX SBOM and full provenance.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,scope=${{ matrix.cache }},mode=max

      - name: Pull exactly what was pushed
        # The architecture's image manifest from the pushed index, so the
        # checks (and check:image's size) see the image without its attestation.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          platform="$(node scripts/release-image.mjs platform --image "$IMAGE@$DIGEST" --arch "$ARCH")"
          echo "linux/$ARCH image in $DIGEST: $platform"
          docker pull "$IMAGE@$platform"
          docker tag "$IMAGE@$platform" asterism:release

      - name: Start the image and check its size
        run: pnpm check:image --image asterism:release

      - name: Check the web fetch tool's browser in the image
        run: pnpm check:fetch-browser-container --image asterism:release

      - name: Check theme storage in the image
        run: pnpm check:theme-storage-container
        env:
          THEME_TEST_RUNTIME_IMAGE: asterism:release

      - name: Install the pinned Trivy
        run: node scripts/install-trivy.mjs

      - name: Scan the image for known vulnerabilities
        # US-92.2, US-95.5: a release with a fixable critical or high is never tagged.
        run: pnpm check:vulns --image asterism:release

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Keep the digest for publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

      - name: Read the SBOM for attesting
        # Checked here so a rehearsal catches an SBOM actions/attest would refuse.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/sbom"
          node scripts/release-image.mjs sbom --image "$IMAGE@$DIGEST" --out "$RUNNER_TEMP/sbom/sbom-$ARCH.spdx.json"

      - name: Keep the SBOM for publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.arch }}
          path: ${{ runner.temp }}/sbom/sbom-${{ matrix.arch }}.spdx.json
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish ${{ needs.version.outputs.version }}
    needs: [version, image]
    # Only a pushed tag publishes. Any run by hand is a rehearsal, even one
    # started on a release tag.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # US-92.3, US-92.4: only this job attests and signs (Sigstore through
      # the workflow's OIDC identity: GitHub artifact attestations and a
      # cosign signature).
      id-token: write
      attestations: write

    steps:
      - name: Checkout, with every release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Move latest only for the newest release
        # A run for an older tag (finishing late, or re-run) tags its version
        # but leaves latest on the newest release.
        id: latest
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          newest="$(git tag --list 'v*' | node --input-type=module -e '
            import { latestRelease } from "./scripts/release.mjs";
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            console.log(latestRelease(input.split("\n").filter(Boolean)) ?? "");
          ')"
          echo "Newest release tag: v$newest"
          if [ "$newest" = "$VERSION" ]; then echo "move=true" >> "$GITHUB_OUTPUT"; else echo "move=false" >> "$GITHUB_OUTPUT"; fi

      - name: Collect the checked digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Collect the SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/sbom
          pattern: sbom-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the version, and latest when it is the newest
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
          MOVE_LATEST: ${{ steps.latest.outputs.move }}
        run: |
          annotation() { echo "--annotation" "index:org.opencontainers.image.$1=$2"; }
          tags=(--tag "$IMAGE:$VERSION")
          if [ "$MOVE_LATEST" = true ]; then tags+=(--tag "$IMAGE:latest"); fi
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            "${tags[@]}" \
            $(annotation source "https://github.com/dbracewell/Asterism") \
            $(annotation version "$VERSION") \
            $(annotation revision "$GITHUB_SHA") \
            $(annotation licenses "Apache-2.0") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Show the published image
        id: index
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"

      - name: Attest the build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}

      - name: Attest the amd64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom/sbom-amd64.spdx.json

      - name: Attest the arm64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom/sbom-arm64.spdx.json

      - name: Verify the attestations
        # A release nobody can verify fails here, after tagging, so it is seen.
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          for predicate in https://slsa.dev/provenance/v1 https://spdx.dev/Document/v2.3; do
            gh attestation verify "oci://$IMAGE@$DIGEST" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners \
              --predicate-type "$predicate"
          done

      - name: Install the pinned cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign the published index
        # US-92.4: keyless, through the workflow's OIDC identity; the signature
        # is stored beside the image and recorded in the public Rekor log.
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Verify the signature
        # The identity administrators check (docs/deployment.md), narrowed to
        # this run's tag.
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity-regexp '^https://github\.com/dbracewell/Asterism/\.github/workflows/release\.yml@refs/tags/v' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
            --certificate-github-workflow-ref "$GITHUB_REF" \
            > /dev/null
          echo "Signature verified for $IMAGE@$DIGEST ($GITHUB_REF)."

  release-page:
    name: Create the GitHub Release
    needs: [version, publish]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Creating a release; nothing else in this run can write to the repository.
      contents: write
    steps:
      - name: Checkout, with every release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Create or update the release page
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-page.mjs "$VERSION" > "$RUNNER_TEMP/notes.md"
          newest="$(git tag --list 'v*' | node --input-type=module -e '
            import { latestRelease } from "./scripts/release.mjs";
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            console.log(latestRelease(input.split("\n").filter(Boolean)) ?? "");
          ')"
          latest=false
          if [ "$newest" = "$VERSION" ]; then latest=true; fi
          # A re-run updates the page it made instead of failing.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "Asterism $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest="$latest"
          else
            gh release create "$TAG" --verify-tag --title "Asterism $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest="$latest"
          fi
