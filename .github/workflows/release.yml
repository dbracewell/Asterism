name: Release

# US-91.5: a pushed v<version> tag (from `pnpm release`) publishes the CPU image
# to ghcr.io/dbracewell/asterism for amd64 and arm64. Each architecture is
# pushed by digest only, pulled back and checked as in CI (US-91.2); only when
# both pass do the version and `latest` tags point at them. The GPU build is
# built from source and not published.
#
# Run it by hand (Actions → Release → Run workflow) to rehearse a release: it
# builds, pushes by digest and checks both architectures, but tags nothing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dbracewell/asterism

jobs:
  version:
    name: Check the tag is the app version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compare the tag with package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME is not v$version; tag releases with pnpm release" >&2
            exit 1
          fi
          node scripts/check-workspace-tasks.mjs
          echo "version=$version" >> "$GITHUB_OUTPUT"

  image:
    name: Build and check ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            # Shares the CI job's cache, so a release rebuilds little.
            cache: asterism-image
          - arch: arm64
            runner: ubuntu-24.04-arm
            cache: asterism-image-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Make room for the image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Install dependencies for the theme storage check
        run: |
          pnpm install --frozen-lockfile --config.strictDepBuilds=false --config.ignore-scripts=true
          pnpm --filter @asterism/frontend install --frozen-lockfile --config.strictDepBuilds=false --config.ignore-scripts=true

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          use: false

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            ASTERISM_VERSION=${{ needs.version.outputs.version }}
            ASTERISM_COMMIT=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,scope=${{ matrix.cache }},mode=max

      - name: Pull exactly what was pushed
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          docker tag "$IMAGE@$DIGEST" asterism:release

      - name: Start the image and check its size
        run: pnpm check:image --image asterism:release --max-size-gb 5

      - name: Check the web fetch tool's browser in the image
        run: pnpm check:fetch-browser-container --image asterism:release

      - name: Check theme storage in the image
        run: pnpm check:theme-storage-container
        env:
          THEME_TEST_RUNTIME_IMAGE: asterism:release

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Keep the digest for publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish ${{ needs.version.outputs.version }}
    needs: [version, image]
    # Only a pushed tag publishes. Any run by hand is a rehearsal, even one
    # started on a release tag.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout, with every release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Move latest only for the newest release
        # A run for an older tag (finishing late, or re-run) tags its version
        # but leaves latest on the newest release.
        id: latest
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          newest="$(git tag --list 'v*' | node --input-type=module -e '
            import { latestRelease } from "./scripts/release.mjs";
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            console.log(latestRelease(input.split("\n").filter(Boolean)) ?? "");
          ')"
          echo "Newest release tag: v$newest"
          if [ "$newest" = "$VERSION" ]; then echo "move=true" >> "$GITHUB_OUTPUT"; else echo "move=false" >> "$GITHUB_OUTPUT"; fi

      - name: Collect the checked digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the version, and latest when it is the newest
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
          MOVE_LATEST: ${{ steps.latest.outputs.move }}
        run: |
          annotation() { echo "--annotation" "index:org.opencontainers.image.$1=$2"; }
          tags=(--tag "$IMAGE:$VERSION")
          if [ "$MOVE_LATEST" = true ]; then tags+=(--tag "$IMAGE:latest"); fi
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            "${tags[@]}" \
            $(annotation source "https://github.com/dbracewell/Asterism") \
            $(annotation version "$VERSION") \
            $(annotation revision "$GITHUB_SHA") \
            $(annotation licenses "Apache-2.0") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Show the published image
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
