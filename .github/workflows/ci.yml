name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request cancels the run it replaces; runs on
# main always finish.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The jobs run in parallel. "Lint, Typecheck, Test" and "Frontend E2E
# (Playwright)" are summary jobs that pass only when the jobs they name pass,
# so the required checks keep their names whatever the job layout.
jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The release notes check compares against the base branch.
          fetch-depth: 0

      - name: Verify checkout has no runtime dotenv files
        run: node scripts/check-no-dotenv.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.13.0"
          cache: pnpm

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock

      - name: Install dependencies
        # Formatting and the repository checks need no native modules.
        run: |
          pnpm install --frozen-lockfile --config.ignore-scripts=true
          pnpm --filter @asterism/frontend install --frozen-lockfile --config.ignore-scripts=true

      - name: Verify workspace task configuration
        run: pnpm check:workspace-tasks

      - name: Verify documentation links
        run: pnpm docs:check

      - name: Verify base images and actions are pinned
        run: pnpm check:pins

      - name: Verify accepted vulnerability findings have a reason and expiry
        run: pnpm check:trivyignore

      - name: Verify release notes cover migrations and configuration changes
        # A pull request is compared with its base branch, a push with the
        # commit it replaced (nothing to compare for a new branch).
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "No base to compare with"
          else
            pnpm check:release-notes --base "$BASE"
          fi

      - name: Check formatting
        run: pnpm format:check

      - name: Test the configuration scripts
        run: pnpm test:config

      - name: Verify Docker frontend build needs no dotenv or runtime secrets
        run: docker build --target frontend-build -t asterism-frontend-build-check .

  backend:
    name: Backend lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify checkout has no runtime dotenv files
        run: node scripts/check-no-dotenv.mjs

      - name: Setup pnpm
        # Runs the backend's package scripts; they need no Node packages.
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.13.0"

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock

      - name: Lint
        run: pnpm --filter @asterism/backend lint

      - name: Typecheck
        run: pnpm --filter @asterism/backend typecheck

      - name: Test
        run: pnpm --filter @asterism/backend test

      - name: Verify the default backend install has no PyTorch
        # US-94.2: torch, torchvision, diffusers and accelerate belong to the
        # local-image extra; this names the package that pulls one in.
        run: pnpm check:default-install

      - name: Test local image generation with the local-image extra
        # After the tests above, which ran on the default install without it.
        run: pnpm --filter @asterism/backend test:local-image

      - name: Verify single-worker backend container launch contract
        run: pnpm test:container-launch

  frontend:
    name: Frontend lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify checkout has no runtime dotenv files
        run: node scripts/check-no-dotenv.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.13.0"
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @asterism/frontend install --frozen-lockfile

      - name: Verify better-sqlite3 loads with a temporary database
        run: |
          mkdir -p "$RUNNER_TEMP/asterism-native-check"
          pnpm --filter @asterism/frontend exec node -e "const Database=require('better-sqlite3'); const db=new Database(process.argv[1]); db.prepare('select 1').get(); db.close(); console.log('better-sqlite3 ok')" "$RUNNER_TEMP/asterism-native-check/verify.db"

      - name: Lint
        run: pnpm --filter @asterism/frontend lint

      - name: Typecheck
        run: pnpm --filter @asterism/frontend typecheck

      - name: Test
        run: pnpm --filter @asterism/frontend test

      - name: Verify synthetic secrets do not enter browser artifacts or build logs
        run: |
          export BETTER_AUTH_SECRET="ci-$(openssl rand -hex 24)"
          export SYSTEM_KEY="ci-$(openssl rand -hex 24)"
          export ADMIN_PASSPHRASE="ci-$(openssl rand -hex 24)"
          log="$RUNNER_TEMP/asterism-build.log"
          pnpm build 2>&1 | tee "$log"
          node scripts/check-client-secret-leaks.mjs apps/frontend/.next/static apps/frontend/src/lib/client
          for name in BETTER_AUTH_SECRET SYSTEM_KEY ADMIN_PASSPHRASE; do
            if grep -Fq "${!name}" "$log"; then
              echo "$name leaked into build output" >&2
              exit 1
            fi
          done

  quality-gates:
    name: Lint, Typecheck, Test
    if: always()
    needs: [repository-checks, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done

  image-checks:
    # US-91.2: a change that breaks the image fails here, not in an upgrade.
    name: Build and check the image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The upgrade check finds the previous release among the tags.
          fetch-depth: 0

      - name: Make room for the image
        # The runner's preinstalled SDKs leave too little disk for the image,
        # its build cache and the loaded copy.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.13.0"
          cache: pnpm

      - name: Install dependencies for the theme storage check
        # TypeScript and zod only; the checks need no native modules.
        run: |
          pnpm install --frozen-lockfile --config.ignore-scripts=true
          pnpm --filter @asterism/frontend install --frozen-lockfile --config.ignore-scripts=true

      - name: Read the app version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Leave the daemon's own builder as the default, so the theme storage
          # check's `docker build` can use the loaded image as its base.
          use: false

      - name: Build the CPU image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          load: true
          tags: asterism:ci
          build-args: |
            ASTERISM_VERSION=${{ steps.version.outputs.version }}
            ASTERISM_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=asterism-image
          # Only main writes the cache (exporting it takes about 3 minutes);
          # pull requests build from main's.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=asterism-image,mode=max' || '' }}

      - name: Start the image and check its size
        run: pnpm check:image --image asterism:ci

      - name: Check the web fetch tool's browser in the image
        run: pnpm check:fetch-browser-container --image asterism:ci

      - name: Check theme storage in the image
        run: pnpm check:theme-storage-container
        env:
          THEME_TEST_RUNTIME_IMAGE: asterism:ci

      - name: Install the pinned Trivy
        # US-92.2: a release tarball checked against the SHA-256 in the script,
        # not aquasecurity/trivy-action (see scripts/install-trivy.mjs).
        run: node scripts/install-trivy.mjs

      - name: Scan the image for known vulnerabilities
        # Fails on a critical or high with a fix (US-95.5); prints the highs.
        run: pnpm check:vulns --image asterism:ci

      - name: Scan the lockfiles for known vulnerabilities
        run: pnpm check:vulns --lockfiles

      - name: Upgrade from the previous release
        # US-91.6: skipped, with a message, until a release precedes this commit.
        # The published image is public, so pull requests, forks included, get
        # no registry credentials.
        run: pnpm check:upgrade --to asterism:ci

  frontend-e2e-shard:
    # The suite runs one worker per runner (see playwright.config.ts), so it is
    # split across runners instead. Each shard builds and serves its own app.
    name: Frontend E2E shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    container:
      image: node:22.13.0-bookworm@sha256:fa54405993eaa6bab6b6e460f5f3e945a2e2f07942ba31c0e297a7d9c2041f62
      options: --user root
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify checkout has no runtime dotenv files
        run: node scripts/check-no-dotenv.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.17.0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock

      - name: Install native build toolchain
        run: |
          apt-get update
          apt-get install -y build-essential python3 make g++

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @asterism/frontend install --frozen-lockfile

      - name: Verify better-sqlite3 loads with a temporary database
        run: |
          mkdir -p "$RUNNER_TEMP/asterism-native-check"
          pnpm --filter @asterism/frontend exec node -e "const Database=require('better-sqlite3'); const db=new Database(process.argv[1]); db.prepare('select 1').get(); db.close(); console.log('better-sqlite3 ok')" "$RUNNER_TEMP/asterism-native-check/verify.db"

      - name: Install Playwright browser
        run: pnpm --filter @asterism/frontend exec playwright install --with-deps chromium

      - name: Run frontend e2e tests with isolated configuration
        run: node scripts/run-isolated-e2e.mjs --retries=0 --shard=${{ matrix.shard }}/4

      - name: Verify E2E did not create repository databases
        if: always()
        run: test ! -e apps/frontend/ci-users.db

      - name: Retain browser review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-ui-review-${{ matrix.shard }}
          path: |
            apps/frontend/playwright-report/
            apps/frontend/test-results/
          retention-days: 7
          if-no-files-found: warn

  frontend-e2e:
    name: Frontend E2E (Playwright)
    if: always()
    needs: [frontend-e2e-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every shard to pass
        env:
          RESULT: ${{ needs.frontend-e2e-shard.result }}
        run: |
          echo "Shards: $RESULT"
          [ "$RESULT" = success ]
