name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-gates:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The release notes check compares against the base branch.
          fetch-depth: 0

      - name: Verify checkout has no runtime dotenv files
        run: node scripts/check-no-dotenv.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Install native build toolchain
        run: |
          if [ "$(id -u)" -ne 0 ]; then
            sudo apt-get update
            sudo apt-get install -y build-essential python3 make g++
          else
            apt-get update
            apt-get install -y build-essential python3 make g++
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.strictDepBuilds=false --config.ignore-scripts=false

      - name: Approve build scripts for native dependencies
        run: pnpm approve-builds --all

      - name: Install frontend workspace dependencies
        run: pnpm --filter @asterism/frontend install --frozen-lockfile --config.strictDepBuilds=false --config.ignore-scripts=false

      - name: Approve build scripts for frontend native dependencies
        run: pnpm approve-builds --all

      - name: Verify better-sqlite3 loads with a temporary database
        run: |
          mkdir -p "$RUNNER_TEMP/asterism-native-check"
          pnpm --filter @asterism/frontend exec node -e "const Database=require('better-sqlite3'); const db=new Database(process.argv[1]); db.prepare('select 1').get(); db.close(); console.log('better-sqlite3 ok')" "$RUNNER_TEMP/asterism-native-check/verify.db"

      - name: Verify workspace task configuration
        run: pnpm check:workspace-tasks

      - name: Verify documentation links
        run: pnpm docs:check

      - name: Verify base images and actions are pinned
        run: pnpm check:pins

      - name: Verify release notes cover migrations and configuration changes
        # A pull request is compared with its base branch, a push with the
        # commit it replaced (nothing to compare for a new branch).
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "No base to compare with"
          else
            pnpm check:release-notes --base "$BASE"
          fi

      - name: Run quality gates
        run: pnpm format:check && pnpm lint && pnpm typecheck && pnpm test

      - name: Verify synthetic secrets do not enter browser artifacts or build logs
        run: |
          export BETTER_AUTH_SECRET="ci-$(openssl rand -hex 24)"
          export SYSTEM_KEY="ci-$(openssl rand -hex 24)"
          export ADMIN_PASSPHRASE="ci-$(openssl rand -hex 24)"
          log="$RUNNER_TEMP/asterism-build.log"
          pnpm build 2>&1 | tee "$log"
          node scripts/check-client-secret-leaks.mjs apps/frontend/.next/static apps/frontend/src/lib/client
          for name in BETTER_AUTH_SECRET SYSTEM_KEY ADMIN_PASSPHRASE; do
            if grep -Fq "${!name}" "$log"; then
              echo "$name leaked into build output" >&2
              exit 1
            fi
          done

      - name: Verify Docker frontend build needs no dotenv or runtime secrets
        run: docker build --target frontend-build -t asterism-frontend-build-check .

      - name: Verify single-worker backend container launch contract
        run: pnpm test:container-launch

  image-checks:
    # US-91.2: a change that breaks the image fails here, not in an upgrade.
    name: Build and check the image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The upgrade check finds the previous release among the tags.
          fetch-depth: 0

      - name: Make room for the image
        # The runner's preinstalled SDKs leave too little disk for the image,
        # its build cache and the loaded copy.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Install dependencies for the theme storage check
        # TypeScript and zod only; the checks need no native modules.
        run: |
          pnpm install --frozen-lockfile --config.strictDepBuilds=false --config.ignore-scripts=true
          pnpm --filter @asterism/frontend install --frozen-lockfile --config.strictDepBuilds=false --config.ignore-scripts=true

      - name: Read the app version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          # Leave the daemon's own builder as the default, so the theme storage
          # check's `docker build` can use the loaded image as its base.
          use: false

      - name: Build the CPU image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          load: true
          tags: asterism:ci
          build-args: |
            ASTERISM_VERSION=${{ steps.version.outputs.version }}
            ASTERISM_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=asterism-image
          cache-to: type=gha,scope=asterism-image,mode=max

      - name: Start the image and check its size
        run: pnpm check:image --image asterism:ci

      - name: Check the web fetch tool's browser in the image
        run: pnpm check:fetch-browser-container --image asterism:ci

      - name: Check theme storage in the image
        run: pnpm check:theme-storage-container
        env:
          THEME_TEST_RUNTIME_IMAGE: asterism:ci

      - name: Upgrade from the previous release
        # US-91.6: skipped, with a message, until a release precedes this commit.
        # The published image is public, so pull requests, forks included, get
        # no registry credentials.
        run: pnpm check:upgrade --to asterism:ci

  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    container:
      image: node:22.13.0-bookworm@sha256:fa54405993eaa6bab6b6e460f5f3e945a2e2f07942ba31c0e297a7d9c2041f62
      options: --user root
    timeout-minutes: 20
    needs: quality-gates

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify checkout has no runtime dotenv files
        run: node scripts/check-no-dotenv.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.17.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Install native build toolchain
        run: |
          if [ "$(id -u)" -ne 0 ]; then
            sudo apt-get update
            sudo apt-get install -y build-essential python3 make g++
          else
            apt-get update
            apt-get install -y build-essential python3 make g++
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.strictDepBuilds=false --config.ignore-scripts=false

      - name: Approve build scripts for native dependencies
        run: pnpm approve-builds --all

      - name: Install frontend workspace dependencies
        run: pnpm --filter @asterism/frontend install --frozen-lockfile --config.strictDepBuilds=false --config.ignore-scripts=false

      - name: Approve build scripts for frontend native dependencies
        run: pnpm approve-builds --all

      - name: Verify better-sqlite3 loads with a temporary database
        run: |
          mkdir -p "$RUNNER_TEMP/asterism-native-check"
          pnpm --filter @asterism/frontend exec node -e "const Database=require('better-sqlite3'); const db=new Database(process.argv[1]); db.prepare('select 1').get(); db.close(); console.log('better-sqlite3 ok')" "$RUNNER_TEMP/asterism-native-check/verify.db"

      - name: Install Playwright browser
        run: pnpm --filter @asterism/frontend exec playwright install --with-deps chromium

      - name: Run frontend e2e tests with isolated configuration
        run: node scripts/run-isolated-e2e.mjs --retries=0

      - name: Verify E2E did not create repository databases
        if: always()
        run: test ! -e apps/frontend/ci-users.db

      - name: Retain browser review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-ui-review
          path: |
            apps/frontend/playwright-report/
            apps/frontend/test-results/
          retention-days: 7
          if-no-files-found: warn
