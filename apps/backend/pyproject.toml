[project]
name = "asterism-core"
version = "0.1.0"
description = "Backend for Asterism, a multi-agent chat system."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "aiosqlite>=0.22.1",
  "asyncpg>=0.31.0",
  "bm25s>=0.3.10",
  "cachetools>=7.1.4",
  "fastapi>=0.136.3",
  "filetype>=1.2.0",
  "html-to-markdown>=3.10.2",
  "llama-cpp-python>=0.3.34",
  "networkx>=3.6.1",
  "openai>=2.38.0",
  "playwright>=1.62.0",
  "pydantic>=2.13.4",
  "pyjwt[crypto]>=2.13.0",
  "pystemmer>=3.1.0",
  "requests>=2.34.2",
  "scikit-learn>=1.9.0",
  "sqlalchemy[asyncio]>=2.0.50",
  "torch>=2.13.0",
  "transformers>=5.14.1",
  "uvicorn[standard]>=0.48.0",
  "websocket>=0.2.1",
]

[dependency-groups]
dev = [
  "ruff>=0.15.15",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "httpx>=0.28.0",
  "httpx2>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asterism"]


[tool.ruff]
target-version = "py313"
src = ["asterism"]

[tool.ruff.lint]
select = ["E", "F", "I"]
fixable = ["ALL"]

[tool.pyright]
reportPrivateImportUsage = "none"
enableTypeIgnoreComments = true
include = ["asterism/*"]
stubPath = "asterism/*"
#typeCheckingMode = "basic"

reportReturnType = "warning"
reportArgumentType = "warning"
reportOperatorIssue = "warning"
reportImportCycles = "warning"
reportDuplicateImport = "warning"
reportUnusedCallResult = "none"
