[project]
name = "asterism-core"
version = "0.2.2"
description = "Backend for Asterism, a multi-agent chat system."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
  "accelerate>=1.15.0",
  "aiosqlite>=0.22.1",
  "beautifulsoup4>=4.15.0",
  "cachetools>=7.1.4",
  "diffusers>=0.41",
  "fastapi>=0.136.3",
  "filetype>=1.2.0",
  "fpdf2>=2.9.0",
  "html-to-markdown>=3.10.2",
  "httpx>=0.28.0",
  "websockets>=15.0",
  "huggingface-hub>=1.25",
  "lancedb>=0.29.2,<0.30",
  "markdown-it-py>=4.2.0",
  "markitdown[docx,pdf,pptx,xls,xlsx]>=0.1.7,<0.2",
  "num2words>=0.5.14",
  "onnxruntime>=1.20,<2",
  "openai>=2.38.0",
  "pillow>=13,<14",
  "playwright>=1.62.0",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.15.0",
  "pyjwt[crypto]>=2.14.0",
  "pypdfium2>=5.13,<6",
  "python-docx>=1.2.0",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0.3",
  "requests>=2.34.2",
  "sqlalchemy[asyncio]>=2.0.50",
  "tiktoken>=0.14.0",
  # Held at 2.13 until EPIC-94 drops torch from the default image: 2.15 takes
  # the image past its 5 GB budget. US-94.3 removes this cap.
  "torch>=2.13.0,<2.14",
  "torchvision>=0.24,<0.29",
  "transformers>=5.14.1",
  "truststore>=0.10.4",
  "uvicorn[standard]>=0.48.0",
  "alembic>=1.16",
]

[dependency-groups]
dev = [
  "ruff>=0.15.15",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "basedpyright>=1.40.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asterism"]


[tool.ruff]
line-length = 120
target-version = "py313"
src = ["asterism"]


[tool.ruff.lint]
select = ["E", "F", "I"]
fixable = ["ALL"]

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.basedpyright]
include = ["asterism"]
typeCheckingMode = "standard"
reportPrivateImportUsage = "none"
enableTypeIgnoreComments = true
reportReturnType = "warning"
reportArgumentType = "none"
reportOperatorIssue = "warning"
reportImportCycles = "warning"
reportDuplicateImport = "warning"
reportUnusedCallResult = "none"
reportMissingParameterType = "none"
reportOptionalMemberAccess = "none"
reportExplicitAny = "none"
reportOptionalSubscript = "none"

[tool.ruff.lint.per-file-ignores]
# Migration scripts hold frozen, generated DDL and SQL; long lines are expected.
"asterism/db/migrations/versions/*.py" = ["E501"]

# Linux installs CPU-only torch from PyTorch's CPU index: Docker, CI and Linux
# development need no CUDA libraries (US-90.8). The Docker GPU build reinstalls
# the same versions from PyPI (see TORCH_VARIANT in the Dockerfile). macOS
# keeps PyPI's wheels, which have no CUDA.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
