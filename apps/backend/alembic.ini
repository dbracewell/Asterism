# Alembic CLI configuration for contributors, e.g.
#   uv run alembic revision --autogenerate -m "add widgets"
# The database URL comes from DB_URL / STORAGE_ROOT (asterism.core.config);
# the application builds the same configuration in asterism.db.migrate.
[alembic]
script_location = %(here)s/asterism/db/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
