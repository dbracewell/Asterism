<svg xmlns="http://www.w3.org/2000/svg" viewBox="36 -18 260 260">
  <!-- Asterism constellation mark, simplified for small sizes on an Atlas "star" tile.
       Source of truth for favicon.ico and apple-icon.png: pnpm generate:icons -->
  <rect x="36" y="-18" width="260" height="260" rx="58" fill="#3B5BDB"/>
  <g stroke="#F5F7FB" stroke-width="16" stroke-linecap="round">
    <line x1="80" y1="125" x2="150" y2="115"/>
    <line x1="150" y1="115" x2="180" y2="35"/>
    <line x1="180" y1="35" x2="250" y2="105"/>
    <line x1="150" y1="115" x2="205" y2="190"/>
    <line x1="205" y1="190" x2="250" y2="105"/>
  </g>
  <g fill="#F5F7FB">
    <circle cx="80" cy="125" r="20"/>
    <circle cx="180" cy="35" r="22.5"/>
    <circle cx="250" cy="105" r="22.5"/>
    <circle cx="205" cy="190" r="22.5"/>
    <circle cx="150" cy="115" r="35"/>
  </g>
</svg>
