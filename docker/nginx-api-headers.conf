# Security headers for API responses (FastAPI and Better Auth), US-86.5.
# API responses are data, never pages: nothing in them may run, load or be framed.
# A location that adds headers drops the server's, so HSTS is included here too.
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy same-origin always;
include /tmp/asterism-nginx/hsts.conf;
