worker_processes auto;
pid /tmp/asterism-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    # Rendered at startup from settings by scripts/edge-config.mjs (US-86.5):
    # trusted proxies for the real client address.
    include /tmp/asterism-nginx/http.conf;
    # Do not log query strings: chat WebSocket URLs contain JWTs.
    # The request id is the one the backend logs (X-Request-ID, US-86.6).
    log_format safe '$remote_addr $request_method $uri $status $request_id';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/asterism-client-body;
    proxy_temp_path /tmp/asterism-proxy;
    fastcgi_temp_path /tmp/asterism-fastcgi;
    uwsgi_temp_path /tmp/asterism-uwsgi;
    scgi_temp_path /tmp/asterism-scgi;
    server_tokens off;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    # Preserve TLS scheme when a trusted external proxy terminates HTTPS.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        '' $scheme;
    }

    # Request rate limits per client address (after trusted-proxy resolution).
    # Sized so a class of about 30 behind one school address can sign in,
    # upload and open chats together; floods from one address are refused.
    # Reads (GET/HEAD) are not limited: sessions and tokens are fetched often.
    map $request_method $limited_client {
        GET "";
        HEAD "";
        default $binary_remote_addr;
    }
    limit_req_zone $limited_client zone=auth:10m rate=60r/m;
    limit_req_zone $limited_client zone=uploads:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=chat_socket:10m rate=120r/m;
    limit_req_status 429;
    limit_req_log_level warn;

    server {
        listen 3000;
        # Upload limit and HSTS, rendered from MAX_UPLOAD_FILE_SIZE_BYTES and PUBLIC_URL.
        include /tmp/asterism-nginx/server.conf;
        error_page 413 @upload_too_large;
        error_page 429 @rate_limited;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Replaced, never appended: the services see only the resolved client.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # One id per request, shared with the backend's log lines (US-86.6).
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        location @rate_limited {
            include /app/docker/nginx-api-headers.conf;
            add_header Retry-After 60 always;
            default_type application/json;
            return 429 '{"detail":"Too many requests. Wait a minute and try again."}';
        }

        # Better Auth: sign-in, sign-up, password reset and other writes.
        location /api/auth/ {
            limit_req zone=auth burst=60 nodelay;
            include /app/docker/nginx-api-headers.conf;
            proxy_pass http://127.0.0.1:3001;
        }
        # The two upload endpoints (library files and chat draft sources).
        location ~ ^/api/py/(files/|chat/drafts/[^/]+/uploads)$ {
            limit_req zone=uploads burst=60 nodelay;
            include /app/docker/nginx-api-headers.conf;
            proxy_pass http://127.0.0.1:8000;
        }
        # Chat WebSocket handshakes.
        location /api/py/chat/stream/ {
            limit_req zone=chat_socket burst=60 nodelay;
            include /app/docker/nginx-api-headers.conf;
            proxy_pass http://127.0.0.1:8000;
        }
        location /api/py/ {
            # Preserve the prefix: FastAPI has root_path=/api/py.
            include /app/docker/nginx-api-headers.conf;
            proxy_pass http://127.0.0.1:8000;
        }
        location / {
            # Next.js sets the page CSP (with a per-request nonce) and the
            # other security headers; HSTS comes from server.conf.
            proxy_pass http://127.0.0.1:3001;
        }
    }
}
