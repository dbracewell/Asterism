worker_processes auto;
pid /tmp/asterism-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    # Do not log query strings: chat WebSocket URLs contain JWTs.
    log_format safe '$remote_addr $request_method $uri $status';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/asterism-client-body;
    proxy_temp_path /tmp/asterism-proxy;
    fastcgi_temp_path /tmp/asterism-fastcgi;
    uwsgi_temp_path /tmp/asterism-uwsgi;
    scgi_temp_path /tmp/asterism-scgi;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    # Preserve TLS scheme when a trusted external proxy terminates HTTPS.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        '' $scheme;
    }
    server {
        listen 3000;
        client_max_body_size 100m;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        location /api/py/ {
            # Preserve the prefix: FastAPI has root_path=/api/py.
            proxy_pass http://127.0.0.1:8000;
        }
        location / {
            proxy_pass http://127.0.0.1:3001;
        }
    }
}
