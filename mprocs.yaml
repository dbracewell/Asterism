procs:
  frontend:
    cmd:
      - pnpm
      - --filter
      - "@asterism/frontend"
      - dev:raw
    cwd: <CONFIG_DIR>
    env:
      DB_URL: null
      CORS_ALLOWED_ORIGINS: null
      MAX_CHARS_FOR_RETRIEVAL: null
      DEFAULT_ALLOWED_TOOLS: null
      PORT: null
    stop: SIGTERM
  backend:
    cmd:
      - pnpm
      - --filter
      - "@asterism/backend"
      - dev:raw
    cwd: <CONFIG_DIR>
    env:
      BETTER_AUTH_SECRET: null
      ADMIN_PASSPHRASE: null
      BETTER_AUTH_DB_PATH: null
      PORT: null
    stop: SIGTERM
