services:
  asterism:
    # The published image (US-91.5), for amd64 and arm64. ASTERISM_VERSION in
    # .env is the release you run; upgrading means changing it after reading the
    # release notes. To build from source instead, see docker-compose.build.yml.
    image: ghcr.io/dbracewell/asterism:${ASTERISM_VERSION:?Set ASTERISM_VERSION in .env to the release to run, for example 0.2.0}
    # Optional: lets the app reach model servers on this host (for example
    # Ollama at http://host.docker.internal:11434). Remove it if every provider
    # is elsewhere.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Locked down by default (US-115.2): the app runs as UID 10001 on port 3000
    # and needs no Linux capabilities, never gains privileges, and has a
    # process and thread limit.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      SYSTEM_KEY: ${SYSTEM_KEY:?Set SYSTEM_KEY}
      ADMIN_PASSPHRASE: ${ADMIN_PASSPHRASE:?Set ADMIN_PASSPHRASE}
      # Your TLS proxy's address, so rate limits see real clients (ADR-0071).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Backend logs (US-86.6): INFO and text by default; json for log collectors.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}

    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - storage:/storage
      # Backup archives (US-86.4): `docker compose exec asterism /app/docker/entrypoint.sh backup`.
      # Copy them off this host too; see docs/architecture/backup-and-restore.md.
      - backups:/backups
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  storage:
  backups:
