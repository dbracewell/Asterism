services:
  asterism:
    build:
      context: .
      dockerfile: Dockerfile
      # What the image was built from, shown in Admin Settings → Status (US-91.1):
      # ASTERISM_COMMIT=$(git rev-parse HEAD) docker compose up -d --build
      args:
        ASTERISM_VERSION: ${ASTERISM_VERSION:-unknown}
        ASTERISM_COMMIT: ${ASTERISM_COMMIT:-unknown}
    image: asterism:local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      SYSTEM_KEY: ${SYSTEM_KEY:?Set SYSTEM_KEY}
      ADMIN_PASSPHRASE: ${ADMIN_PASSPHRASE:?Set ADMIN_PASSPHRASE}
      # Your TLS proxy's address, so rate limits see real clients (ADR-0071).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Backend logs (US-86.6): INFO and text by default; json for log collectors.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}

    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - storage:/storage
      # Backup archives (US-86.4): `docker compose exec asterism /app/docker/entrypoint.sh backup`.
      # Copy them off this host too; see docs/architecture/backup-and-restore.md.
      - backups:/backups
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  storage:
  backups:
